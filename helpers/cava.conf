[general]
framerate = 30
bars = 56
autosens = 1
sensitivity = 80
lower_cutoff_freq = 40
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono
reverse = 0

[smoothing]
monstercat = 1
waves = 0
noise_reduction = 60
